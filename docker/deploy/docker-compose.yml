# Production deployment using the custom image from ghcr.io.
# Copy .env.example to .env and fill in the values before running.
#
# Usage:
#   docker compose up -d
#   docker compose pull && docker compose up -d   # update to latest

services:
  openproject:
    image: ghcr.io/fabiooraziomirto/openproject:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST__NAME}
      OPENPROJECT_SECRET__KEY__BASE: ${OPENPROJECT_SECRET__KEY__BASE}
      DATABASE_URL: postgresql://${DB_USER:-openproject}:${DB_PASSWORD}@db/${DB_NAME:-openproject}
      OPENPROJECT_RAILS__CACHE__STORE: file_store
      OPENPROJECT_CACHE__MEMCACHE__SERVER: ""
      IMAP_ENABLED: "false"
    volumes:
      - opdata:/var/openproject/assets
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-openproject}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-openproject}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openproject}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  opdata:
  pgdata:
